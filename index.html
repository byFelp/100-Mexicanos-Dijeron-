m:auto}.screen .brand-mark{width:clamp(29px,4vw,48px);height:clamp(29px,4vw,48px)}.screen .brand-name{font-size:clamp(12px,2vw,20px)}.screen .scoreline{margin:clamp(10px,2vh,20px) 0}.screen .team{padding:clamp(7px,1.8vw,18px)}.screen .question-display{margin-bottom:clamp(8px,1.4vh,18px)}.screen .board{gap:clamp(5px,.9vw,11px)}.screen .tile{min-height:clamp(32px,7vh,72px);padding:clamp(4px,.8vw,10px) clamp(5px,1vw,14px)}.screen .tile .tile-no{flex-basis:clamp(23px,3vw,40px);height:clamp(23px,3vw,40px)}.screen .strikes{margin:clamp(5px,1.2vh,14px)}.screen .strike{font-size:clamp(19px,3.4vw,36px)}.screen .board-foot{margin-top:auto}.screen-connect{width:min(520px,95vw);text-align:center;padding:30px;border-radius:24px;background:#0a2039eF;border:1px solid #ffffff24;box-shadow:var(--shadow)}.screen-connect h1{font-size:32px;margin:0 0 7px}.screen-connect p{color:var(--muted);font-size:14px;line-height:1.55}.screen-connect .input{text-align:center;font-size:23px;letter-spacing:.18em;text-transform:uppercase;max-width:250px;margin:6px auto 12px}.screen-connect .button{font-size:15px;padding:13px 20px}.screen .screen-round{color:var(--gold);font-weight:950;letter-spacing:.22em;text-align:center;font-size:clamp(11px,1.8vw,18px);text-transform:uppercase;margin:0 0 6px}.remote-mode{max-width:850px;margin:22px auto 0;border:1px solid var(--line);border-radius:20px;padding:16px;background:#06172bcc}.remote-controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.remote-controls button{padding:11px 6px;font-size:12px}.remote-answer-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}.remote-answer-buttons button{min-height:40px;background:#123c67;border:1px solid #f4c75e44;border-radius:10px;font-weight:850;font-size:13px}.remote-answer-buttons button.used{background:#184b44;color:#8ee1bf;border-color:#5bd4a177}.remote-title{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:850}.prese <body><div id="root"></div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),root=$('#root');const STORE='mex100.questions.v1',GAME='mex100.game.v1',PINKEY='mex100.pin.v1';
const samples=[{id:'q1',text:'Menciona algo que la gente hace apenas se despierta',answers:[['Revisar el celular',34],['Ir al baño',22],['Apagar la alarma',17],['Lavarse los dientes',12],['Tomar café',9],['Bañarse',6]]},{id:'q2',text:'Algo que no puede faltar en una fiesta mexicana',answers:[['Música',30],['Comida',26],['Pastel',16],['Piñata',12],['Bebidas',10],['Familia',6]]},{id:'q3',text:'Menciona algo que la gente guarda en un cajón',answers:[['Cables',28],['Pilas',21],['Fotos',18],['Herramientas',14],['Medicinas',11],['Monedas',8]]}];
const load=(k,d)=>{try{let x=JSON.parse(localStorage.getItem(k));return x??d}catch{return d}};let questions=load(STORE,samples);if(!localStorage.getItem(STORE))localStorage.setItem(STORE,JSON.stringify(questions));
let game=load(GAME,{activeQuestion:0,round:1,teams:['Equipo azul','Equipo dorado'],scores:[0,0],roundPoints:0,strikes:0,revealed:[],started:false,roundTeam:0});let peer=null,connections=new Set(),editorIndex=-1,screenState=null,screenConnected=false,soundOn=true,solo=false,audioContext=null,lastRoomCode='',reconnectTimer=null;try{lastRoomCode=sessionStorage.getItem('mex100.screen.room')||''}catch{}
const save=()=>localStorage.setItem(GAME,JSON.stringify(game)),saveQs=()=>localStorage.setItem(STORE,JSON.stringify(questions));
function route(){return location.pathname.replace(/\/$/,'')||'/'}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function primeAudio(){try{let C=window.AudioContext||window.webkitAudioContext;if(!audioContext&&C)audioContext=new C();if(audioContext?.state==='suspended')audioContext.resume()}catch{}}
function tone(type='good'){if(!soundOn)return;try{primeAudio();let c=audioContext;if(!c)return;let o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);let t=c.currentTime;o.type=type==='bad'?'sawtooth':'sine';o.frequency.setValueAtTime(type==='bad'?220:type==='flip'?550:680,t);o.frequency.exponentialRampToValueAtTime(type==='bad'?95:type==='flip'?880:1050,t+.16);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.11,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.23);o.start(t);o.stop(t+.24);}catch{}}
function activeQ(){return questions[game.activeQuestion]||{text:'Elige una pregunta para comenzar',answers:[]}}
function pub(){let q=activeQ();return {type:'state',question:q.text||'Pregunta lista',round:game.round,teams:game.teams,scores:game.scores,roundPoints:game.roundPoints,strikes:game.strikes,roundTeam:game.roundTeam,started:game.started,cards:q.answers.map((a,i)=>game.revealed.includes(i)?{index:i,text:a[0],points:+a[1]||0}:null)}}
function broadcast(){save();let data=pub();screenState=data;for(const c of connections)try{if(c.open)c.send(data)}catch{};if(route()==='/pantalla'&&screenConnected)renderScreen()}
function setPath(path){history.pushState({},'',path);solo=false;render()}
function topbar(){return `<header class="topbar"><div class="brand"><span class="brand-mark">★</span><div>100 MEXICANOS<small>EDICIÓN DE SALA · JUEGO EN GRUPO</small></div></div><div class="top-actions"><button class="button small" id="soundBtn">${soundOn?'♫ Sonido':'♪ Silencio'}</button><button class="button small" id="fullBtn">⛶ Pantalla</button></div></header>`}
function renderHome(tab='jugar'){root.innerHTML=`<main class="app">${topbar()}<section class="hero"><div class="eyebrow">¡Que comience el juego!</div><h1>100 Mexicanos Dijeron</h1><p>Prepara tus preguntas, arma la sala y controla el tablero desde el celular. La TV recibe únicamente las respuestas que revelas.</p></section><nav class="tabs"><button class="tab ${tab==='jugar'?'active':''}" data-tab="jugar">🎙 Jugar</button><button class="tab ${tab==='preguntas'?'active':''}" data-tab="preguntas">▤ Mis preguntas</button><button class="tab ${tab==='solo'?'active':''}" data-tab="solo">▣ Un solo dispositivo</button></nav><section id="mainPanel" class="panel"></section></main>`;bindGlobal();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderHome(b.dataset.tab));if(tab==='preguntas')renderQuestions();else if(tab==='solo')renderSolo();else renderPlaySetup()}
function renderPlaySetup(){const panel=$('#mainPanel');panel.innerHTML=`<div class="section-head"><div><h2>Prepara la partida</h2><p class="sub">Selecciona pregunta, equipos y ronda. Después crea la sala para conectar la TV.</p></div></div><div class="two"><div class="field"><label for="teamA">Equipo 1</label><input id="teamA" class="input" value="${esc(game.teams[0])}" maxlength="24"></div><div class="field"><label for="teamB">Equipo 2</label><input id="teamB" class="input" value="${esc(game.teams[1])}" maxlength="24"></div></div><div class="field" style="margin-top:14px"><label>Pregunta de esta ronda</label><div class="question-list">${questions.length?questions.map((q,i)=>`<button class="q-item ${i===game.activeQuestion?'selected':''}" data-q="${i}"><span class="room-output" style="font-size:13px;padding:6px 10px;letter-spacing:0">${i+1}</span><span class="q-text">${esc(q.text)}</span><small>${q.answers.length} respuestas</small></button>`).join(''):`<div class="empty">Aún no hay preguntas. Añade una desde “Mis preguntas”.</div>`}</div></div><div class="two"><div class="field"><label for="roundN">Ronda</label><input id="roundN" class="input" type="number" min="1" max="99" value="${game.round}"></div><div class="field"><label>Marcador actual</label><div class="callout">${esc(game.teams[0])}: <b>${game.scores[0]}</b> &nbsp; · &nbsp; ${esc(game.teams[1])}: <b>${game.scores[1]}</b></div></div></div><div class="room-box"><div class="field"><label>Sala para la televisión</label><div class="room-output" id="roomOut">${peer?roomCodeFromPeer(): 'Aún no creada'}</div></div><button id="createRoom" class="button primary" ${questions.length?'':'disabled'}>${peer?'↻ Crear otra sala':'＋ Crear sala'}</button></div><div class="row wrap"><button id="startGame" class="button good" ${questions.length?'':'disabled'}>▶ Iniciar / mostrar tablero</button><button id="goControl" class="button" ${peer?'':'disabled'}>Abrir controles</button></div><div class="status"><span id="dot" class="dot ${screenConnected?'online':''}"></span><span id="connLabel">${screenConnected?'Televisión conectada':'Crea la sala y escribe el código en la TV'}</span></div><div class="callout" style="margin-top:14px">En la televisión abre la dirección de esta página con <b>/pantalla</b> al final. Escribe el código de sala que aparece aquí. Mantén esta pestaña abierta durante la partida.</div>`;
$('#teamA').oninput=e=>{game.teams[0]=e.target.value||'Equipo azul';broadcast()};$('#teamB').oninput=e=>{game.teams[1]=e.target.value||'Equipo dorado';broadcast()};$('#roundN').onchange=e=>{game.round=Math.max(1,+e.target.value||1);broadcast()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{game.activeQuestion=+b.dataset.q;game.revealed=[];game.roundPoints=0;game.strikes=0;game.started=false;broadcast();renderPlaySetup()});$('#createRoom').onclick=createRoom;$('#startGame').onclick=()=>{game.started=true;broadcast();tone('good');setPath('/control')};$('#goControl').onclick=()=>setPath('/control')}
function roomCodeFromPeer(){return peer?peer.__room||'------':'------'}
function genCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=chars[Math.random()*chars.length|0];return s}
function createRoom(){primeAudio();if(!window.Peer){alert('No se cargó el servicio de conexión. Revisa tu internet y vuelve a intentarlo.');return}if(peer)try{peer.destroy()}catch{};connections.clear();screenConnected=false;let code=genCode();const id='mex100-'+code.toLowerCase();$('#createRoom').disabled=true;$('#createRoom').textContent='Conectando…';peer=new Peer(id);peer.__room=code;peer.on('open',()=>{screenConnected=false;renderPlaySetup();});peer.on('connection',conn=>{if(connnections.size>=2){conn.close();return}connections.add(conn);conn.on('open',()=>{conn.send(pub());screenConnected=true;updateConnectionUI()});conn.on('close',()=>{connections.delete(conn);screenConnected=connections.size>0;updateConnectionUI()});conn.on('error',()=>{connections.delete(conn);updateConnectionUI()})});peer.on('disconnected',()=>{screenConnected=false;updateConnectionUI();setTimeout(()=>{if(peer&&!peer.destroyed)peer.reconnect()},1500)});peer.on('error',err=>{console.error(err);if(err.type==='unavailable-id'){peer.destroy();peer=null;createRoom()}else{screenConnected=false;updateConnectionUI();if($('#createRoom')){$('#createRoom').disabled=false;$('#createRoom').textContent='Reintentar conexión'}}});}
function updateConnectionUI(){let d=$('#dot'),l=$('#connLabel');if(d)d.classList.toggle('online',screenConnected);if(l)l.textContent=screenConnected?'Televisión conectada':peer?'Sala lista · esperando que entre la televisión':'Desconectado';let go=$('#goControl');if(go)go.disabled=!peer}
function renderQuestions(){const panel=$('#mainPanel');panel.innerHTML=`<div class="section-head"><div><h2>Mis preguntas</h2><p class="sub">Guarda tus preguntas para futuras partidas. Cada una admite de 1 a 10 respuestas.</p></div><button id="newQ" class="button primary">＋ Nueva pregunta</button></div><div class="row wrap"><button id="exportQ" class="button small">⇧ Exportar JSON</button><button id="importQ" class="button small">⇩ Importar JSON</button><input type="file" id="fileQ" accept="application/json,.json" class="hidden"></div><div class="divider"></div><div id="qList" class="question-list">${questions.map((q,i)=>`<div class="q-item"><span class="room-output" style="font-size:13px;padding:6px 10px;letter-spacing:0">${i+1}</span><span class="q-text">${esc(q.text)}</span><small>${q.answers.length} respuestas</small><button class="button small" data-edit="${i}">Editar</button><button class="button small" data-del="${i}">Eliminar</button></div>`).join('')||'<div class="empty">No tienes preguntas guardadas todavía.</div>'}</div><div class="callout">Las preguntas se guardan en este dispositivo. El enlace de la TV nunca recibe el texto de respuestas que aún no se han revelado.</div>`;
$('#newQ').onclick=()=>openQuestion();$('#exportQ').onclick=exportQuestions;$('#importQ').onclick=()=>$('#fileQ').click();$('#fileQ').onchange=importQuestions;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openQuestion(+b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let i=+b.dataset.del;if(confirm('¿Eliminar esta pregunta?')){questions.splice(i,1);if(i===game.activeQuestion){game.revealed=[];game.roundPoints=0;game.strikes=0}if(game.activeQuestion>=questions.length)game.activeQuestion=Math.max(0,questions.length-1);saveQs();save();renderQuestions()}})}
function openQuestion(i=-1){editorIndex=i;const q=i>=0?questions[i]:{text:'',answers:[['',25],['',20],['',15],['',10],['',5]]};root.insertAdjacentHTML('beforeend',`<div class="modalback" id="modal"><form class="modal" id="qForm"><h2>${i>=0?'Editar pregunta':'Nueva pregunta'}</h2><p class="sub">Escribe las respuestas en el orden en que quieres que aparezcan en el tablero.</p><div class="field"><label>Pregunta</label><textarea class="input" id="qText" rows="2" maxlength="180" required placeholder="Ej. Menciona una comida que se prepara en una fiesta">${esc(q.text)}</textarea></div><div class="divider"></div><div class="section-head"><div class="label">Respuestas <span id="answerCount">${q.answers.length}/10</span></div><button type="button" id="addAnswer" class="button small">＋ Añadir</button></div><div id="answerFields" class="answers" style="margin-top:10px">${answerFields(q.answers)}</div><div class="divider"></div><div class="row" style="justify-content:flex-end"><button type="button" id="cancelEdit" class="button">Cancelar</button><button class="button primary" type="submit">Guardar pregunta</button></div></form></div>`);
const modal=$('#modal');modal.onclick=e=>{if(e.target===modal)modal.remove()};$('#cancelEdit').onclick=()=>modal.remove();$('#addAnswer').onclick=()=>{const a=readAnswers();if(a.length>=10)return; a.push(['',0]);$('#answerFields').innerHTML=answerFields(a);bindAnswerButtons()};bindAnswerButtons();$('#qForm').onsubmit=e=>{e.preventDefault();let text=$('#qText').value.trim(),answers=readAnswers();if(!text||answers.some(a=>!a[0])){alert('Completa el texto de la pregunta y todas sus respuestas.');return}if(!answers.length||answers.length>10){alert('Agrega entre 1 y 10 respuestas.');return}let obj={id:i>=0?questions[i].id:'q'+Date.now(),text,answers};if(i>=0){questions[i]=obj;if(i===game.activeQuestion){game.revealed=[];game.roundPoints=0;game.strikes=0;save()}}else questions.push(obj);saveQs();modal.remove();renderQuestions()}}
function answerFields(list){return list.map((a,i)=>`<div class="answer-edit" data-answer="${i}"><span class="num">${i+1}</span><input class="input ans-text" maxlength="65" value="${esc(a[0])}" placeholder="Texto de respuesta" aria-label="Respuesta ${i+1}"><input class="input ans-points" type="number" min="0" max="999" value="${+a[1]||0}" aria-label="Puntos"><button type="button" class="button icon" data-up="${i}" ${i===0?'disabled':''} aria-label="Subir">↑</button><button type="button" class="button icon" data-down="${i}" ${i===list.length-1?'disabled':''} aria-label="Bajar">↓</button><button type="button" class="button icon danger" data-rm="${i}" aria-label="Eliminar">×</button></div>`).join('')}
function readAnswers(){return [...document.querySelectorAll('.answer-edit')].map(e=>[e.querySelector('.ans-text').value.trim(),Math.max(0,+e.querySelector('.ans-points').value||0)])}
function bindAnswerButtons(){document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{let a=readAnswers();if(a.length<=1){alert('Una pregunta debe tener al menos una respuesta.');return}a.splice(+b.dataset.rm,1);$('#answerFields').innerHTML=answerFields(a);bindAnswerButtons()});document.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{let a=readAnswers(),i=+(b.dataset.up??b.dataset.down),j=i+(b.hasAttribute('data-up')?-1:1);[a[i],a[j]]=[a[j],a[i]];$('#answerFields').innerHTML=answerFields(a);bindAnswerButtons()});$('#answerCount').textContent=`${document.querySelectorAll('.answer-edit').length}/10`;$('#addAnswer').disabled=document.querySelectorAll('.answer-edit').length>=10}
function exportQuestions(){const blob=new Blob([JSON.stringify({format:'mexicanos-dijeron-questions',version:1,questions},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mis-preguntas-100-mexicanos.json';a.click();URL.revokeObjectURL(a.href)}
function importQuestions(e){let f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result),arr=Array.isArray(data)?data:data.questions;if(!Array.isArray(arr)||!arr.length)throw Error();let clean=arr.map((q,i)=>{if(typeof q.text!=='string'||!Array.isArray(q.answers)||q.answers.length<1||q.answers.length>10)throw Error();let answers=q.answers.map(a=>Array.isArray(a)?[String(a[0]||''),Math.max(0,+a[1]||0)]:[String(a.text||''),Math.max(0,+a.points||0)]);if(answers.some(a=>!a[0]))throw Error();return{id:String(q.id||'import-'+Date.now()+'-'+i),text:q.text.trim(),answers}});questions=clean;game.activeQuestion=0;saveQs();save();renderQuestions();alert('Preguntas importadas correctamente.')}catch{alert('No pude leer el archivo. Verifica que use el formato JSON exportado por esta aplicación.')}};r.readAsText(f);e.target.value=''}
function boardHTML(state,full=false){let p=state||pub();return `<div class="game-top"><div class="room-code">${p.round?'RONDA '+p.round:'TABLERO'}</div><div class="row"><span class="pill">${p.started?'EN JUEGO':'ESPERANDO'}</span><button id="screenFull" class="button small">⛶</button></div></div><div class="scoreline"><div class="team ${p.roundTeam===0?'active':''}"><div class="team-name">${esc(p.teams?.[0]||'Equipo azul')}</div><div class="team-score">${+p.scores?.[0]||0}</div></div><div class="round-score"><small>PUNTOS DE ESTA RONDA</small><strong>${+p.roundPoints||0}</strong></div><div class="team ${p.roundTeam===1?'active':''}"><div class="team-name">${esc(p.teams?.[1]||'Equipo dorado')}</div><div class="team-score">${+p.scores?.[1]||0}</div></div></div><div class="round-label">${p.started?'¿Qué contestaron?':'¡A jugar!'}</div><h2 class="question-display">${esc(p.question||'Conectando con la partida…')}</h2><div class="board">${(p.cards||[]).map((c,i)=>c?`<div class="tile reveal"><span class="tile-no">${i+1}</span><span class="tile-text">${esc(c.text)}</span><span class="tile-points">${+c.points||0}</span></div>`:`<div class="tile closed"><span class="tile-no">${i+1}</span><span class="tile-text"></span><span class="tile-points"></span></div>`).join('')}</div><div class="strikes">${[0,1,2].map(i=>`<span class="strike ${i<(p.strikes||0)?'on':''}">✕</span>`).join('')}</div><div class="board-foot"><span>✦</span><span>${p.started?'100 MEXICANOS DIJERON':'LA RESPUESTA MÁS POPULAR'}</span><span>✦</span></div>`}
function renderScreen(){if(solo){renderSolo();return}if(!screenConnected&&screenState&&lastRoomCode){scheduleScreenReconnect();root.innerHTML=`<main class="screen-wrap"><section class="screen"><div class="status" style="justify-content:center;color:var(--gold)"><span class="dot"></span><span>Reconectando a la sala ${esc(lastRoomCode)}…</span></div>${boardHTML(screenState)}</section></main>`;return}if(!screenConnected||!screenState){root.innerHTML=`<main class="screen-wrap"><section class="screen-connect"><div class="brand" style="justify-content:center"><span class="brand-mark">★</span><div>100 MEXICANOS<small>CONÉCTATE A UNA PARTIDA</small></div></div><h1>Tablero de juego</h1><p>En el control del presentador crea una sala. Después escribe aquí el código de seis letras.</p><input id="joinCode" class="input" maxlength="6" autocomplete="off" placeholder="ABC123"><br><button id="joinBtn" class="button primary">Conectar a la sala</button><div class="status" style="justify-content:center"><span class="dot ${peer&&!peer.disconnected?'online':''}"></span><span id="screenStatus">${peer&&!peer.disconnected?'Conectado al servicio · esperando sala':'Listo para conectar'}</span></div><p class="kbd">Asegúrate de abrir la misma página web en ambos dispositivos.</p></section></main>`;$('#joinCode').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'');$('#joinBtn').onclick=joinRoom;$('#joinCode').onkeydown=e=>{if(e.key==='Enter')joinRoom()};return}root.innerHTML=`<main class="screen-wrap"><section class="screen">${boardHTML(screenState)}</section></main>`;$('#screenFull').onclick=fullScreen;const last=renderScreen._last||{};if(last.strikes!==screenState.strikes&&screenState.strikes>0)tone('bad');if(last.cards&&screenState.cards.some((c,i)=>c&&!last.cards[i]))tone('flip');renderScreen._last=screenState}
function scheduleScreenReconnect(delay=3500){if(!lastRoomCode||reconnectTimer)return;reconnectTimer=setTimeout(()=>{reconnectTimer=null;if(route()==='/pantalla'&&!screenConnected)joinRoom(true)},delay)}
function joinRoom(automatic=false){primeAudio();let code=automatic?lastRoomCode:($('#joinCode')?.value||'').trim().toUpperCase();if(code.length!==6){if(!automatic)alert('Escribe el código de seis caracteres.');return}if(!window.Peer){if(!automatic)alert('No se cargó el servicio de conexión. Revisa tu internet.');return}if(!automatic){lastRoomCode=code;try{sessionStorage.setItem('mex100.screen.room',code)}catch{}}if(peer)try{peer.destroy()}catch{};screenConnected=false;screenState=null;if($('#joinBtn')){$('#joinBtn').disabled=true;$('#joinBtn').textContent='Conectando…';$('#screenStatus').textContent='Buscando la sala…'}peer=new Peer();peer.on('open',()=>{let c=peer.connect('mex100-'+code.toLowerCase(),{reliable:true});let timeout=setTimeout(()=>{if(!screenConnected){if($('#joinBtn')){$('#joinBtn').disabled=false;$('#joinBtn').textContent='Reintentar conexión';$('#screenStatus').textContent='No encontramos la sala. Verifica el código y que el control siga abierto.'}scheduleScreenReconnect()}},9000);c.on('open',()=>{clearTimeout(timeout);connections.add(c);screenConnected=true;if($('#screenStatus'))$('#screenStatus').textContent='Conectado';c.on('data',d=>{if(d&&d.type==='state'){screenState=d;renderScreen()}});c.on('close',()=>{connections.delete(c);screenConnected=false;scheduleScreenReconnect();renderScreen()});c.on('error',()=>{connections.delete(c);screenConnected=false;scheduleScreenReconnect();renderScreen()})});c.on('error',()=>{clearTimeout(timeout);screenConnected=false;if($('#joinBtn')){$('#joinBtn').disabled=false;$('#joinBtn').textContent='Reintentar conexión';$('#screenStatus').textContent='Error al conectar. Comprueba el código.'}scheduleScreenReconnect()})});peer.on('disconnected',()=>{screenConnected=false;scheduleScreenReconnect(1200);renderScreen()});peer.on('error',err=>{console.error(err);screenConnected=false;if($('#joinBtn')){$('#joinBtn').disabled=false;$('#joinBtn').textContent='Reintentar conexión';$('#screenStatus').textContent='Error de conexión. Reintentando…'}scheduleScreenReconnect();renderScreen()})}
function renderControl(){if(!game.started&&!peer){renderHome('jugar');return}let q=activeQ();root.innerHTML=`<main class="app presenter-only">${topbar()}<section class="panel"><div class="game-top"><div><div class="eyebrow">Panel del presentador</div><div class="room-code">SALA · ${peer?roomCodeFromPeer():'SIN SALA'}</div></div><div class="row wrap"><button id="backSetup" class="button small">⚙ Preparar</button><button id="fullBoard" class="button small">⛶ Tablero</button></div></div><div class="status"><span class="dot ${screenConnected?'online':''}"></span><span>${screenConnected?'Televisión conectada y sincronizada':peer?'Esperando a la televisión':'Crea primero una sala en Preparar'}</span></div><div class="divider"></div>${boardHTML(pub(),true)}<div class="divider"></div><div class="section-head"><div><h2>Respuestas</h2><p class="sub">Toca una tarjeta para revelar. Se envía sólo esa respuesta a la TV.</p></div><span class="pill">${game.revealed.length}/${q.answers.length} reveladas</span></div><div class="answers">${q.answers.map((a,i)=>`<button class="q-item ${game.revealed.includes(i)?'selected':''}" data-reveal="${i}"><span class="room-output" style="font-size:13px;padding:6px 10px;letter-spacing:0">${i+1}</span><span class="q-text">${esc(a[0])}</span><small>${+a[1]||0} pts</small><span>${game.revealed.includes(i)?'✓':'＋'}</span></button>`).join('')||'<div class="empty">Añade una pregunta antes de comenzar.</div>'}</div><div class="divider"></div><div class="two"><div><div class="section-head"><div><h2>Errores</h2><p class="sub">${game.strikes} de 3 errores</p></div><button id="strikeBtn" class="button danger" style="font-size:22px;font-weight:950;padding:9px 20px">✕</button></div><button id="resetStrikes" class="button small" style="margin-top:8px">Reiniciar errores</button></div><div><div class="section-head"><div><h2>Puntuación</h2><p class="sub">Puntos acumulados y de la ronda</p></div></div><div class="field"><label>Equipo que recibe puntos</label><select id="roundTeam" class="input"><option value="0" ${game.roundTeam===0?'selected':''}>${esc(game.teams[0])}</option><option value="1" ${game.roundTeam===1?'selected':''}>${esc(game.teams[1])}</option></select></div><div class="row" style="margin-top:9px"><button id="award" class="button primary" style="flex:1">Asignar ${game.roundPoints} pts</button><button id="clearRoundPts" class="button small">Vaciar ronda</button></div></div></div><div class="two" style="margin-top:14px"><div class="field"><label>${esc(game.teams[0])} · ajustar marcador</label><input class="input score-input" type="number" data-score="0" value="${game.scores[0]}"></div><div class="field"><label>${esc(game.teams[1])} · ajustar marcador</label><input class="input score-input" type="number" data-score="1" value="${game.scores[1]}"></div></div><div class="divider"></div><div class="section-head"><div><h2>Rondas</h2><p class="sub">Al iniciar otra ronda puedes elegir una pregunta distinta desde Preparar.</p></div></div><div class="row wrap"><button id="prevRound" class="button">← Anterior</button><button id="startRound" class="button good">▶ Iniciar ronda</button><button id="nextRound" class="button">Siguiente →</button><button id="resetGame" class="button danger">↺ Reiniciar partida</button></div></section></main>`;bindGlobal();$('#backSetup').onclick=()=>renderHome('jugar');$('#fullBoard').onclick=()=>{let c=roomCodeFromPeer();window.open(location.origin+'/pantalla'+(c&&c!=='------'?'?sala='+encodeURIComponent(c):''),'_blank','noopener');};document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{let i=+b.dataset.reveal;if(game.revealed.includes(i)){game.revealed=game.revealed.filter(x=>x!==i);game.roundPoints=Math.max(0,game.roundPoints-(+q.answers[i][1]||0))}else{game.revealed.push(i);game.roundPoints+=+q.answers[i][1]||0;tone('flip')}broadcast();renderControl()});$('#strikeBtn').onclick=()=>{game.strikes=Math.min(3,game.strikes+1);tone('bad');broadcast();renderControl()};$('#resetStrikes').onclick=()=>{game.strikes=0;broadcast();renderControl()};$('#roundTeam').onchange=e=>{game.roundTeam=+e.target.value;broadcast()};$('#award').onclick=()=>{let i=game.roundTeam;game.scores[i]+=game.roundPoints;game.roundPoints=0;broadcast();renderControl()};$('#clearRoundPts').onclick=()=>{game.roundPoints=0;broadcast();renderControl()};document.querySelectorAll('.score-input').forEach(x=>x.onchange=()=>{game.scores[+x.dataset.score]=Math.max(0,+x.value||0);broadcast();renderControl()});$('#prevRound').onclick=()=>{game.round=Math.max(1,game.round-1);game.revealed=[];game.roundPoints=0;game.strikes=0;game.started=true;broadcast();renderControl()};$('#nextRound').onclick=()=>{game.round++;game.activeQuestion=(game.activeQuestion+1)%Math.max(questions.length,1);game.revealed=[];game.roundPoints=0;game.strikes=0;game.started=true;broadcast();renderControl()};$('#startRound').onclick=()=>{game.started=true;game.revealed=[];game.roundPoints=0;game.strikes=0;broadcast();renderControl()};$('#resetGame').onclick=()=>{if(confirm('¿Reiniciar toda la partida y los marcadores?')){game={...game,round:1,scores:[0,0],roundPoints:0,strikes:0,revealed:[],started:false,activeQuestion:0};broadcast();renderHome('jugar')}}}
function renderSolo(){solo=true;let s=pub();root.innerHTML=`<main class="app"><section class="panel"><div class="game-top"><div class="brand"><span class="brand-mark">★</span><div>100 MEXICANOS<small>MODO UN SOLO DISPOSITIVO</small></div></div><div class="row"><button class="button small" id="soloFull">⛶</button><button class="button small" id="soloExit">Salir</button></div></div>${boardHTML(s)}<section class="remote-mode"><div class="remote-title">Controles discretos · toca un número para revelarlo</div><div class="remote-answer-buttons">${activeQ().answers.map((a,i)=>`<button class="${game.revealed.includes(i)?'used':''}" data-solo-reveal="${i}">${i+1}${game.revealed.includes(i)?' ✓':''}</button>`).join('')}</div><div class="remote-controls"><button class="button danger" id="soloStrike">✕ Error (${game.strikes}/3)</button><button class="button" id="soloUndo">Ocultar última</button><button class="button" id="soloPrev">← Ronda</button><button class="button" id="soloNext">Ronda →</button><button class="button primary" id="soloAward">Asignar puntos</button></div><div class="two" style="margin-top:10px"><select id="soloTeam" class="input"><option value="0">${esc(game.teams[0])}</option><option value="1">${esc(game.teams[1])}</option></select><button class="button small" id="soloReset">Reiniciar partida</button></div></section></section></main>`;$('#soloFull').onclick=fullScreen;$('#soloExit').onclick=()=>{solo=false;renderHome('jugar')};document.querySelectorAll('[data-solo-reveal]').forEach(b=>b.onclick=()=>{let i=+b.dataset.soloReveal;if(!game.revealed.includes(i)){game.revealed.push(i);game.roundPoints+=+activeQ().answers[i][1]||0;tone('flip');broadcast();renderSolo()}});$('#soloStrike').onclick=()=>{game.strikes=Math.min(3,game.strikes+1);tone('bad');broadcast();renderSolo()};$('#soloUndo').onclick=()=>{let last=game.revealed.pop();if(last!==undefined)game.roundPoints=Math.max(0,game.roundPoints-(+activeQ().answers[last][1]||0));broadcast();renderSolo()};$('#soloPrev').onclick=()=>{game.round=Math.max(1,game.round-1);game.revealed=[];game.roundPoints=0;game.strikes=0;broadcast();renderSolo()};$('#soloNext').onclick=()=>{game.round++;game.activeQuestion=(game.activeQuestion+1)%Math.max(questions.length,1);game.revealed=[];game.roundPoints=0;game.strikes=0;broadcast();renderSolo()};$('#soloTeam').onchange=e=>game.roundTeam=+e.target.value;$('#soloAward').onclick=()=>{game.scores[game.roundTeam]+=game.roundPoints;game.roundPoints=0;broadcast();renderSolo()};$('#soloReset').onclick=()=>{if(confirm('¿Reiniciar toda la partida?')){game={...game,round:1,scores:[0,0],roundPoints:0,strikes:0,revealed:[],activeQuestion:0,started:false};broadcast();renderSolo()}};$('#screenFull').onclick=fullScreen}
function fullScreen(){let el=document.documentElement;if(!document.fullscreenElement)el.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
function bindGlobal(){let s=$('#soundBtn');if(s)s.onclick=()=>{soundOn=!soundOn;s.textContent=soundOn?'♫ Sonido':'♪ Silencio';if(soundOn)tone('good')};let f=$('#fullBtn');if(f)f.onclick=fullScreen}
function render(){let r=route();if(r==='/pantalla')renderScreen();else if(r==='/control')renderControl();else renderHome()}
window.addEventListener('popstate',()=>{solo=false;render()});window.addEventListener('storage',e=>{if(e.key===STORE)questions=load(STORE,questions);if(e.key===GAME){game=load(GAME,game);render()}});if(route()==='/pantalla'){let params=new URLSearchParams(location.search),c=params.get('sala');if(c){lastRoomCode=c.toUpperCase();try{sessionStorage.setItem('mex100.screen.room',lastRoomCode)}catch{}}if(lastRoomCode)setTimeout(()=>joinRoom(true),100)}render();
})();
</script></body></html>
